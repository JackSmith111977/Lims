openapi: 3.2.0
info:
  title: Laboratory Information Management System API
  version: 0.1.0
  description: 高校科研实验室信息管理系统 API 契约初稿
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Samples
  - name: Tasks
  - name: Reviews
  - name: Reports
  - name: Dashboard
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /samples:
    get:
      tags: [Samples]
      summary: 查询样品
      operationId: listSamples
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: 样品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSamplePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Samples]
      summary: 登记样品
      operationId: createSample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSample'
        '400':
          $ref: '#/components/responses/BadRequest'
  /samples/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Samples]
      summary: 查看样品详情
      operationId: getSample
      responses:
        '200':
          description: 样品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSample'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Samples]
      summary: 修改样品
      operationId: updateSample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleUpdateRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSample'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks:
    get:
      tags: [Tasks]
      summary: 查询任务
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: projectId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskPage'
    post:
      tags: [Tasks]
      summary: 创建实验任务
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tasks]
      summary: 查看任务详情
      operationId: getTask
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      summary: 更新任务
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reviews]
      summary: 审核实验结果
      operationId: reviewTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: 审核成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReview'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{id}/reports:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Reports]
      summary: 生成实验报告
      operationId: createReport
      responses:
        '201':
          description: 报告生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReport'
        '409':
          $ref: '#/components/responses/Conflict'
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: 获取工作台概览
      operationId: getDashboardOverview
      responses:
        '200':
          description: 工作台统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDashboard'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 业务状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginData:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
    SampleCreateRequest:
      type: object
      required: [projectId, name, quantity, unit]
      properties:
        projectId: { type: integer, format: int64 }
        name: { type: string }
        specification: { type: string }
        batchNo: { type: string }
        quantity: { type: number }
        unit: { type: string }
        source: { type: string }
        storageCondition: { type: string }
    SampleUpdateRequest:
      type: object
      properties:
        status: { type: string }
        storageCondition: { type: string }
        location: { type: string }
        remark: { type: string }
    Sample:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sampleCode: { type: string }
        projectId: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string }
        quantity: { type: number }
        unit: { type: string }
    TaskCreateRequest:
      type: object
      required: [projectId, methodId, name, priority]
      properties:
        projectId: { type: integer, format: int64 }
        methodId: { type: integer, format: int64 }
        name: { type: string }
        priority: { type: string }
        plannedStart: { type: string, format: date }
        plannedEnd: { type: string, format: date }
        sampleIds:
          type: array
          items: { type: integer, format: int64 }
    TaskUpdateRequest:
      type: object
      properties:
        status: { type: string }
        remark: { type: string }
    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        taskCode: { type: string }
        projectId: { type: integer, format: int64 }
        methodId: { type: integer, format: int64 }
        name: { type: string }
        priority: { type: string }
        status: { type: string }
    ReviewRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [APPROVED, RETURNED, NEED_MORE] }
        comment: { type: string }
    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        result: { type: string }
        comment: { type: string }
        reviewedAt: { type: string, format: date-time }
    Report:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reportCode: { type: string }
        taskId: { type: integer, format: int64 }
        versionNo: { type: integer }
        status: { type: string }
    Dashboard:
      type: object
      properties:
        sampleCount: { type: integer }
        taskCount: { type: integer }
        pendingReviewCount: { type: integer }
        inventoryAlertCount: { type: integer }
    ApiResponseLogin:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/LoginData' }
        traceId: { type: string }
    ApiResponseSample:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/Sample' }
        traceId: { type: string }
    ApiResponseSamplePage:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Sample' }
            page: { type: integer }
            size: { type: integer }
            total: { type: integer, format: int64 }
        traceId: { type: string }
    ApiResponseTask:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/Task' }
        traceId: { type: string }
    ApiResponseTaskPage:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Task' }
            page: { type: integer }
            size: { type: integer }
            total: { type: integer, format: int64 }
        traceId: { type: string }
    ApiResponseReview:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/Review' }
        traceId: { type: string }
    ApiResponseReport:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/Report' }
        traceId: { type: string }
    ApiResponseDashboard:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/Dashboard' }
        traceId: { type: string }
security:
  - bearerAuth: []
