        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: 服务配置不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 业务状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnprocessableEntity:
      description: 处理失败或异常数据
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginData:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email, nullable: true }
    AdminUserCreateRequest:
      type: object
      required: [email, password, username, realName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        username: { type: string, maxLength: 64 }
        realName: { type: string, maxLength: 64 }
        roleCodes:
          type: array
          items: { type: string }
    AdminUserUpdateRequest:
      type: object
      properties:
        username: { type: string, maxLength: 64 }
        realName: { type: string, maxLength: 64 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        departmentId: { type: integer, format: int64, nullable: true }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        realName: { type: string }
        email: { type: string, format: email, nullable: true }
        status: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/AdminRole' }
    AdminRoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 64 }
    AdminRole:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        status: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AdminPermission' }
    AdminPermission:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        resource: { type: string }
        action: { type: string }
    ApiResponseAdminUser:
      type: object
      properties:
        data: { $ref: '#/components/schemas/AdminUser' }
    ApiResponseAdminUsers:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
    ApiResponseAdminRoles:
      type: object
      properties:
        data:
          type: object
          properties:
            roles:
              type: array
              items: { $ref: '#/components/schemas/AdminRole' }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/AdminPermission' }
    SettingCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        categoryType: { type: string }
        laboratoryId: { type: integer, format: int64, nullable: true }
        parentId: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer }
        symbol: { type: string, nullable: true }
        dimension: { type: string, nullable: true }
    SettingUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/SettingCreateRequest'
    ParameterCreateRequest:
      type: object
      required: [code, name, valueType, value]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        valueType: { type: string, enum: [STRING, NUMBER, BOOLEAN, JSON] }
        value: {}
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ParameterUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ParameterCreateRequest'
    Setting:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        status: { type: string }
    ApiResponseSetting:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Setting' }
    ApiResponseSettingsItems:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Setting' }
    PersonnelUpdateRequest:
      type: object
      properties:
        realName: { type: string, maxLength: 64 }
        departmentId: { type: integer, format: int64, nullable: true }
        positionId: { type: integer, format: int64, nullable: true }
        availabilityStatus: { type: string, enum: [AVAILABLE, ON_LEAVE, QUALIFICATION_SUSPENDED, UNAVAILABLE] }
        availabilityNote: { type: string, maxLength: 255, nullable: true }
        availabilityUntil: { type: string, format: date, nullable: true }
    PersonnelRecordRequest:
      type: object
      properties:
        skillName: { type: string, maxLength: 128 }
        level: { type: string, maxLength: 32, nullable: true }
        qualificationName: { type: string, maxLength: 128 }
        certificateNo: { type: string, maxLength: 64, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, EXPIRED] }
        trainingName: { type: string, maxLength: 128 }
        provider: { type: string, maxLength: 128, nullable: true }
        verifiedAt: { type: string, format: date, nullable: true }
        issuedAt: { type: string, format: date, nullable: true }
        completedAt: { type: string, format: date, nullable: true }
        expiresAt: { type: string, format: date, nullable: true }
        result: { type: string, maxLength: 32, nullable: true }
        notes: { type: string, nullable: true }
    PersonnelTaskSummary:
      type: object
      properties:
        total: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        tasks:
          type: array
          items: { type: object }
    PersonnelAlert:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        severity: { type: string, enum: [WARNING, BLOCKING] }
    Personnel:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        realName: { type: string }
        departmentId: { type: integer, format: int64, nullable: true }
        positionId: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        availabilityStatus: { type: string, enum: [AVAILABLE, ON_LEAVE, QUALIFICATION_SUSPENDED, UNAVAILABLE] }
        availabilityNote: { type: string, nullable: true }
        availabilityUntil: { type: string, format: date, nullable: true }
        taskSummary: { $ref: '#/components/schemas/PersonnelTaskSummary' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/PersonnelAlert' }
        skills: { type: array, items: { type: object } }
        qualifications: { type: array, items: { type: object } }
        training: { type: array, items: { type: object } }
    ApiResponsePersonnel:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Personnel' }
    ApiResponsePersonnelItems:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Personnel' } }
    ApiResponsePersonnelRecord:
      type: object
      properties:
        data: { type: object }
    ApiResponsePersonnelRecords:
      type: object
      properties:
        data: { type: array, items: { type: object } }
    MethodCreateRequest:
      type: object
      required: [methodCode, name, version]
      properties:
        methodCode: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        version: { type: string, maxLength: 32 }
        scope: { type: string, maxLength: 255, nullable: true }
        detectionLimit: { type: number, minimum: 0, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, EXPIRED] }
        documentId: { type: integer, format: int64, nullable: true }
        effectiveAt: { type: string, format: date-time, nullable: true }
        expiredAt: { type: string, format: date-time, nullable: true }
    MethodUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        scope: { type: string, maxLength: 255, nullable: true }
        detectionLimit: { type: number, minimum: 0, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, EXPIRED] }
        documentId: { type: integer, format: int64, nullable: true }
        effectiveAt: { type: string, format: date-time, nullable: true }
        expiredAt: { type: string, format: date-time, nullable: true }
    MethodAttachmentRequest:
      type: object
      required: [fileName, storagePath, fileSize, contentType]
      properties:
        fileName: { type: string, maxLength: 255 }
        storagePath: { type: string, maxLength: 512 }
        fileSize: { type: integer, format: int64, minimum: 0 }
        contentType: { type: string, maxLength: 128 }
    MethodHistory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        methodId: { type: integer, format: int64 }
        methodCode: { type: string }
        fromVersion: { type: string, nullable: true }
        toVersion: { type: string }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        changeType: { type: string, enum: [CREATE_VERSION, UPDATE, STATUS_CHANGE] }
        operatorId: { type: string, format: uuid }
        remark: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    MethodAttachment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        objectType: { type: string }
        objectId: { type: string }
        fileName: { type: string }
        storagePath: { type: string }
        fileSize: { type: integer, format: int64 }
        contentType: { type: string }
        uploadedBy: { type: string, format: uuid }
        uploadedAt: { type: string, format: date-time }
    MethodAttachmentUploadRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: 实验方法或相关标准规范文件 }
    Method:
      type: object
      properties:
        id: { type: integer, format: int64 }
        methodCode: { type: string }
        name: { type: string }
        version: { type: string }
        scope: { type: string, nullable: true }
        detectionLimit: { type: number, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, EXPIRED] }
        documentId: { type: integer, format: int64, nullable: true }
        effectiveAt: { type: string, format: date-time, nullable: true }
        expiredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history: { type: array, items: { $ref: '#/components/schemas/MethodHistory' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/MethodAttachment' } }
    ApiResponseMethod:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/Method' }
        traceId: { type: string }
    ApiResponseMethodItems:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/Method' } }
        traceId: { type: string }
    ApiResponseMethodAttachment:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/MethodAttachment' }
        traceId: { type: string }
    InstrumentRequest:
      type: object
      properties:
        instrumentCode: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        type: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 64, nullable: true }
