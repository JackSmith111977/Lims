openapi: 3.2.0
info:
  title: Laboratory Information Management System API
  version: 0.1.0
  description: 高校科研实验室信息管理系统 API 契约初稿
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Samples
  - name: Tasks
  - name: Projects
  - name: Reviews
  - name: Reports
  - name: Dashboard
  - name: Admin
  - name: Settings
  - name: Personnel
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [Admin]
      summary: 查询用户
      operationId: listUsers
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAdminUsers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: 创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserCreateRequest' }
      responses:
        '201':
          description: 用户创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin]
      summary: 修改用户资料或状态
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdateRequest' }
      responses:
        '200':
          description: 用户更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: 替换用户角色
      operationId: replaceUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCodes]
              properties:
                roleCodes:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: 角色分配成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /roles:
    get:
      tags: [Admin]
      summary: 查询角色及权限
      operationId: listRoles
      responses:
        '200':
          description: 角色和权限列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAdminRoles' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: 创建角色
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRoleCreateRequest' }
      responses:
        '201': { description: 角色创建成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Admin]
      summary: 修改角色
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200': { description: 角色更新成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /roles/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      summary: 替换角色权限
      operationId: replaceRolePermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionCodes]
              properties:
                permissionCodes:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: 权限配置成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /personnel:
    get:
      tags: [Personnel]
      summary: 查询实验室人员
      operationId: listPersonnel
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: availabilityStatus
          schema: { type: string, enum: [AVAILABLE, ON_LEAVE, QUALIFICATION_SUSPENDED, UNAVAILABLE] }
        - in: query
          name: departmentId
          schema: { type: integer, format: int64 }
        - in: query
          name: positionId
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 人员列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponsePersonnelItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /personnel/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Personnel]
      summary: 查询人员详情
      operationId: getPersonnel
      responses:
        '200': { description: 人员详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponsePersonnel' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Personnel]
      summary: 更新人员档案
      operationId: updatePersonnel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonnelUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponsePersonnel' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /personnel/{id}/{recordType}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: recordType
        in: path
        required: true
        schema: { type: string, enum: [skills, qualifications, training] }
    get:
      tags: [Personnel]
      summary: 查询人员能力记录
      operationId: listPersonnelRecords
      responses:
        '200': { description: 能力记录列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponsePersonnelRecords' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Personnel]
      summary: 新增人员能力记录
      operationId: createPersonnelRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonnelRecordRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponsePersonnelRecord' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/laboratories:
    get:
      tags: [Settings]
      summary: 查询实验室
      operationId: listSettingsLaboratories
      responses:
        '200': { description: 实验室列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSettingsItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: 新增实验室
      operationId: createSettingsLaboratory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/laboratories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Settings]
      summary: 修改实验室
      operationId: updateSettingsLaboratory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/departments:
    get:
      tags: [Settings]
      summary: 查询部门
      operationId: listSettingsDepartments
      responses:
        '200': { description: 部门列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSettingsItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: 新增部门
      operationId: createSettingsDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/departments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Settings]
      summary: 修改部门
      operationId: updateSettingsDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/groups:
    get:
      tags: [Settings]
      summary: 查询实验组
      operationId: listSettingsGroups
      responses:
        '200': { description: 实验组列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSettingsItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: 新增实验组
      operationId: createSettingsGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/groups/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Settings]
      summary: 修改实验组
      operationId: updateSettingsGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/categories:
    get:
      tags: [Settings]
      summary: 查询通用分类
      operationId: listSettingsCategories
      parameters:
        - in: query
          name: categoryType
          schema: { type: string }
      responses:
        '200': { description: 分类列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSettingsItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: 新增通用分类
      operationId: createSettingsCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Settings]
      summary: 修改通用分类
      operationId: updateSettingsCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/units:
    get:
      tags: [Settings]
      summary: 查询计量单位
      operationId: listSettingsUnits
      responses:
        '200': { description: 单位列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSettingsItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: 新增计量单位
      operationId: createSettingsUnit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/units/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Settings]
      summary: 修改计量单位
      operationId: updateSettingsUnit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/parameters:
    get:
      tags: [Settings]
      summary: 查询系统参数
      operationId: listSettingsParameters
      responses:
        '200': { description: 参数列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSettingsItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: 新增系统参数
      operationId: createSettingsParameter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParameterCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/parameters/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Settings]
      summary: 修改系统参数
      operationId: updateSettingsParameter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParameterUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseSetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects:
    get:
      tags: [Projects]
      summary: 查询科研项目
      operationId: listProjects
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        - in: query
          name: ownerId
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 项目列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProjectItems' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Projects]
      summary: 创建科研项目
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProject' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      summary: 查看科研项目
      operationId: getProject
      responses:
        '200': { description: 项目详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProject' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: 修改科研项目
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateRequest' }
      responses:
        '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProject' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /samples:
    get:
      tags: [Samples]
      summary: 查询样品
      operationId: listSamples
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [REGISTERED, PROCESSING, PROCESSED, ARCHIVED, DISPOSED] }
        - in: query
          name: projectId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 样品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSampleItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Samples]
      summary: 登记样品
      operationId: createSample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /samples/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Samples]
      summary: 查看样品详情
      operationId: getSample
      responses:
        '200':
