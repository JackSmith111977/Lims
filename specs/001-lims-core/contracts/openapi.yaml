        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: 服务配置不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 业务状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginData:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
    AdminUserCreateRequest:
      type: object
      required: [email, password, username, realName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        username: { type: string, maxLength: 64 }
        realName: { type: string, maxLength: 64 }
        roleCodes:
          type: array
          items: { type: string }
    AdminUserUpdateRequest:
      type: object
      properties:
        username: { type: string, maxLength: 64 }
        realName: { type: string, maxLength: 64 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        departmentId: { type: integer, format: int64, nullable: true }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        realName: { type: string }
        email: { type: string, format: email, nullable: true }
        status: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/AdminRole' }
    AdminRoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 64 }
    AdminRole:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        status: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AdminPermission' }
    AdminPermission:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        resource: { type: string }
        action: { type: string }
    ApiResponseAdminUser:
      type: object
      properties:
        data: { $ref: '#/components/schemas/AdminUser' }
    ApiResponseAdminUsers:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
    ApiResponseAdminRoles:
      type: object
      properties:
        data:
          type: object
          properties:
            roles:
              type: array
              items: { $ref: '#/components/schemas/AdminRole' }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/AdminPermission' }
    SettingCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        categoryType: { type: string }
        laboratoryId: { type: integer, format: int64, nullable: true }
        parentId: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer }
        symbol: { type: string, nullable: true }
        dimension: { type: string, nullable: true }
    SettingUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/SettingCreateRequest'
    ParameterCreateRequest:
      type: object
      required: [code, name, valueType, value]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        valueType: { type: string, enum: [STRING, NUMBER, BOOLEAN, JSON] }
        value: {}
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ParameterUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ParameterCreateRequest'
    Setting:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        status: { type: string }
    ApiResponseSetting:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Setting' }
    ApiResponseSettingsItems:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Setting' }
    PersonnelUpdateRequest:
      type: object
      properties:
        realName: { type: string, maxLength: 64 }
        departmentId: { type: integer, format: int64, nullable: true }
        positionId: { type: integer, format: int64, nullable: true }
        availabilityStatus: { type: string, enum: [AVAILABLE, ON_LEAVE, QUALIFICATION_SUSPENDED, UNAVAILABLE] }
        availabilityNote: { type: string, maxLength: 255, nullable: true }
        availabilityUntil: { type: string, format: date, nullable: true }
    PersonnelRecordRequest:
      type: object
      properties:
        skillName: { type: string, maxLength: 128 }
        level: { type: string, maxLength: 32, nullable: true }
        qualificationName: { type: string, maxLength: 128 }
        certificateNo: { type: string, maxLength: 64, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, EXPIRED] }
        trainingName: { type: string, maxLength: 128 }
        provider: { type: string, maxLength: 128, nullable: true }
        verifiedAt: { type: string, format: date, nullable: true }
        issuedAt: { type: string, format: date, nullable: true }
        completedAt: { type: string, format: date, nullable: true }
        expiresAt: { type: string, format: date, nullable: true }
        result: { type: string, maxLength: 32, nullable: true }
        notes: { type: string, nullable: true }
    PersonnelTaskSummary:
      type: object
      properties:
        total: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        tasks:
          type: array
          items: { type: object }
    PersonnelAlert:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        severity: { type: string, enum: [WARNING, BLOCKING] }
    Personnel:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        realName: { type: string }
        departmentId: { type: integer, format: int64, nullable: true }
        positionId: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        availabilityStatus: { type: string, enum: [AVAILABLE, ON_LEAVE, QUALIFICATION_SUSPENDED, UNAVAILABLE] }
        availabilityNote: { type: string, nullable: true }
        availabilityUntil: { type: string, format: date, nullable: true }
        taskSummary: { $ref: '#/components/schemas/PersonnelTaskSummary' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/PersonnelAlert' }
        skills: { type: array, items: { type: object } }
        qualifications: { type: array, items: { type: object } }
        training: { type: array, items: { type: object } }
    ApiResponsePersonnel:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Personnel' }
    ApiResponsePersonnelItems:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Personnel' } }
    ApiResponsePersonnelRecord:
      type: object
      properties:
        data: { type: object }
    ApiResponsePersonnelRecords:
      type: object
      properties:
        data: { type: array, items: { type: object } }
    SampleCreateRequest:
      type: object
      required: [projectId, name, quantity, unit]
      properties:
        sampleCode: { type: string, maxLength: 32 }
        projectId: { type: integer, format: int64 }
        name: { type: string, maxLength: 128 }
        specification: { type: string, maxLength: 255, nullable: true }
        batchNo: { type: string, maxLength: 64, nullable: true }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 16 }
        source: { type: string, maxLength: 128, nullable: true }
        storageCondition: { type: string, maxLength: 255, nullable: true }
        taskIds: { type: array, items: { type: integer, format: int64 } }
    SampleUpdateRequest:
      type: object
      properties:
        sampleCode: { type: string, maxLength: 32 }
        projectId: { type: integer, format: int64 }
        name: { type: string, maxLength: 128 }
        specification: { type: string, maxLength: 255, nullable: true }
        batchNo: { type: string, maxLength: 64, nullable: true }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 16 }
        source: { type: string, maxLength: 128, nullable: true }
        storageCondition: { type: string, maxLength: 255, nullable: true }
        taskIds: { type: array, items: { type: integer, format: int64 } }
    SampleFlowRequest:
      type: object
      required: [node]
      properties:
        node:
          type: string
          enum: [COLLECT, DISTRIBUTE, TRANSFER, PROCESS, ARCHIVE, DISPOSE]
        location: { type: string, maxLength: 128, nullable: true }
        handoverTo: { type: string, format: uuid, nullable: true }
        remark: { type: string, maxLength: 2000, nullable: true }
    SampleFlow:
      type: object
      required: [id, sampleId, toStatus, node, operatorId, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        sampleId: { type: integer, format: int64 }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        node: { type: string }
        operatorId: { type: string, format: uuid }
        location: { type: string, nullable: true }
        handoverTo: { type: string, format: uuid, nullable: true }
        remark: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    Sample:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sampleCode: { type: string }
        projectId: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string }
        quantity: { type: number }
        unit: { type: string }
        specification: { type: string, nullable: true }
        batchNo: { type: string, nullable: true }
        source: { type: string, nullable: true }
        storageCondition: { type: string, nullable: true }
        registeredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        currentLocation: { type: string, nullable: true }
        project: { type: object, nullable: true }
        tasks: { type: array, items: { type: object } }
    TaskCreateRequest:
      type: object
      required: [taskCode, projectId, methodId, name, priority]
      properties:
        taskCode: { type: string, maxLength: 32 }
        projectId: { type: integer, format: int64 }
        methodId: { type: integer, format: int64 }
        name: { type: string }
        priority: { type: string, enum: [LOW, NORMAL, HIGH] }
        plannedStart: { type: string, format: date }
        plannedEnd: { type: string, format: date }
        remark: { type: string, nullable: true }
        sampleIds:
          type: array
          items: { type: integer, format: int64 }
    TaskUpdateRequest:
      type: object
      properties:
        taskCode: { type: string, maxLength: 32 }
        projectId: { type: integer, format: int64 }
        methodId: { type: integer, format: int64 }
        name: { type: string }
        priority: { type: string, enum: [LOW, NORMAL, HIGH] }
        plannedStart: { type: string, format: date, nullable: true }
        plannedEnd: { type: string, format: date, nullable: true }
        remark: { type: string, nullable: true }
        sampleIds:
          type: array
          items: { type: integer, format: int64 }
    TaskAssignmentRequest:
      type: object
      properties:
        userIds:
          type: array
          items: { type: string, format: uuid }
        groupIds:
          type: array
          items: { type: integer, format: int64 }
    TaskTransitionRequest:
      type: object
      required: [toStatus]
      properties:
        toStatus:
          type: string
          enum: [ASSIGNED, IN_PROGRESS, PENDING_REVIEW, RETURNED, APPROVED, ARCHIVED]
        remark: { type: string, maxLength: 2000, nullable: true }
    TaskAssignment:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        userId: { type: string, format: uuid, nullable: true }
        groupId: { type: integer, format: int64, nullable: true }
        assignedBy: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
    TaskTransition:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        operatorId: { type: string, format: uuid }
        remark: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    TaskHistory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        operatorId: { type: string, format: uuid }
        remark: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        taskCode: { type: string }
        projectId: { type: integer, format: int64 }
        methodId: { type: integer, format: int64 }
        name: { type: string }
        priority: { type: string }
        status: { type: string }
        plannedStart: { type: string, format: date, nullable: true }
        plannedEnd: { type: string, format: date, nullable: true }
        remark: { type: string, nullable: true }
        sampleIds: { type: array, items: { type: integer, format: int64 } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectCreateRequest:
