name: Quality gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: npm run check:branch -- -BranchName "$env:BRANCH_NAME"

  quality:
    name: Quality gates
    runs-on: windows-latest
    env:
      # Build only needs syntactically valid public placeholders; no remote database is used.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: SDD consistency
        shell: pwsh
        run: ./scripts/sdd/check-consistency.ps1

      - name: Versioning
        shell: pwsh
        run: ./scripts/sdd/check-versioning.ps1
